[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Keep local virtualenvs and build outputs out of lint runs.
exclude = ["env", "build", "dist", "lang"]
target-version = "py310"

[tool.ruff.lint]
# Match the historical default set explicitly. Newer ruff versions can add
# rules to their defaults; CI should not change behavior without a deliberate
# update to this list.
select = ["E4", "E7", "E9", "F"]
