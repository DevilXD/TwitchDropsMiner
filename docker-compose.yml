services:
  twitch_miner:
    build:
      context: .
      platform: linux/amd64 # Or linux/arm64
    container_name: twitch_miner_webvnc
    ports:
      - "6080:6080"
    environment:
      - VNC_PASSWORD=secret
    volumes:
      - ./data:/data # cookies.jar, settings.json, cache, log.txt
    restart: unless-stopped
